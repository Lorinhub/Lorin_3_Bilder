<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3 Bilder Galerie</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .gallery {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      width: 95%;
      max-width: 900px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    /* Für größere Bildschirme (PC) */
    @media (min-width: 768px) {
      .gallery {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="gallery">
    <img src="1.jpeg" alt="Bild 1">
    <img src="2.jpeg" alt="Bild 2">
    <img src="3.jpeg" alt="Bild 3">
  </div>

</body>
</html>
